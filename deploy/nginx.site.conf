# nginx site cho Văn Phòng Ảo — certbot sẽ tự thêm phần SSL (443) vào file này
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ACME challenge cho certbot
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # WebSocket /ws: KHÔNG ghi access log — URL có thể mang ?dev=<DEV_TOKEN> (mã bí mật của chủ dự án).
    # Mở trang nên dùng dạng #dev=<token> (phần sau # không bao giờ gửi lên máy chủ / Cloudflare).
    location = /ws {
        access_log off;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # API lịch sử / tin: mỗi yêu cầu có thể trả tới 1,4 MB (ngày đã nén) → giới hạn nhịp để không ai kéo sập VPS dùng chung.
    # Cần vùng `limit_req_zone` khai báo ở http{} (deploy/nginx.limit.conf → /etc/nginx/conf.d/, deploy.sh --setup tự chép).
    location /api/ {
        limit_req zone=vpa_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # trang mở kèm ?dev=<token> (cách cũ) cũng không ghi log
        if ($arg_dev) { access_log off; }
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        # WebSocket (/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
